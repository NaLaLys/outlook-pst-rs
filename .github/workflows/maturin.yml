name: build-wheels

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  wheels-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64, aarch64 ]
        py:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: >
            -m crates/pst-python/Cargo.toml
            --release
            --out dist
            -i python${{ matrix.py }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-py${{ matrix.py }}
          path: dist/*.whl

  release:
    needs: wheels-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: List release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name' > wheel_names.txt

      - name: Generate wheels.html
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          mkdir -p docs
          {
            echo '<!doctype html>'
            echo '<html><body>'
            while IFS= read -r name; do
              echo "  <a href=\"https://github.com/${REPO}/releases/download/${TAG}/${name}\">${name}</a><br>"
            done < wheel_names.txt
            echo '</body></html>'
          } > docs/wheels.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
